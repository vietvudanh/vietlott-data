[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"] # list of folders that contain the packages (["."] by default)

[project]
name = "vietlott-data"
version = "0.3.0"
description = "Open historical Vietlott lottery dataset — Power 6/55, Mega 6/45, Keno, Max 3D and more. Free NDJSON downloads, daily updates, statistics, and Python/Go tools."
authors = [{ name = "Viet Vu", email = "vietvudanh@gmail.com" }]
dependencies = [
    "bs4",
    "polars",
    "pyarrow",
    "lxml",
    "attrs",
    "cattrs",
    "click",
    "pendulum",
    "requests",
    "tabulate",
    "loguru",
]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/vietvudanh/vietlott-data"
Issues = "https://github.com/vietvudanh/vietlott-data/issues"


[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "setuptools", "wheel", "twine", "pre-commit"]
ml = ["numpy", "scikit-learn", "matplotlib", "pandas"]

[project.scripts]
vietlott-crawl = "vietlott.cli.crawl:crawl"
vietlott-missing = "vietlott.cli.missing:detect_missing_data"
vietlott-render-readme = "vietlott.render_readme:main"
vietlott-render-docs = "vietlott.render_docs:main"

[tool.ruff]
line-length = 120
